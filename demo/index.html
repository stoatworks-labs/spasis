  <body>
    <main id="demo">
      <noscript>
        <h1>Spasis</h1>
        <p>
          Four FFGL sources that draw the stereo and surround field as
          sonar-style displays rather than meters, showing where the energy's
          pointing, how wide each part of the spectrum is and what the tonal
          balance looks like. They open their own multichannel capture device,
          because FFGL gives a plugin nothing but a mono magnitude spectrum and
          three of the four can't be drawn from that.
        </p>
        <p>
          This demo runs the plugins' analysis and shaders in your browser, so it
          needs JavaScript and WebGL2. The plugins themselves, their source and
          their downloads are on
          <a href="https://stoatworks-labs.com/software/spasis/">the project page</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/spasis/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/spasis/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/spasis">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
