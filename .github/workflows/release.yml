name: release

# Build the four Spasis sources for the two platforms Resolume runs on:
#   - macOS   -> universal (arm64 + x86_64) "Spasis {Field,Rose,Width,Balance}.bundle"
#   - Windows -> x64 "Spasis {Field,Rose,Width,Balance}.dll" (GLEW static via vcpkg)
#
# Four artefacts per platform and not one, because FFGL resolves a single
# plugMain per binary: four sources are four bundles, not one bundle with four
# entries. All four go in the same zip -- they share a set of controls and an
# operator wants the set.
#
# There is no Linux job and no OpenFX job. Resolume has no Linux build, and
# these are audio-capture sources with no CPU render path to wrap for a
# Resolve-style host.
#
# Trigger manually (Actions > release > Run workflow) or by pushing a v* tag.
# A dispatch run builds everything and publishes nothing -- the release job is
# gated on the tag -- which is the cheap way to check the Windows half.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-universal, os: macos-14 }
          - { name: windows-x86_64,  os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # --- macOS: no extra deps. The universal slice comes from the
      #     CMakeLists' own default, which is set before the first target
      #     exists -- see the comment there. ---
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSPASIS_BUILD_TOOLS=OFF

      # --- Windows: GLEW comes from vcpkg, static-linked (static-md keeps the
      #     CRT dynamic so the plugin matches the host) so the .dll has no
      #     external glew32.dll runtime dependency. ---
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DSPASIS_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          plugins=( "Spasis Field" "Spasis Rose" "Spasis Width" "Spasis Balance" )

          if [ "${{ runner.os }}" = "macOS" ]; then
            for name in "${plugins[@]}"; do
              cp -R "build/$name.bundle" "out/$name.bundle"
              binary="out/$name.bundle/Contents/MacOS/$name"

              # lipo, never the build log: CMAKE_OSX_ARCHITECTURES set after the
              # first target exists is silently ignored, and the log reports
              # success either way. Only the binary knows.
              archs=$( lipo -archs "$binary" )
              echo "  $name: $archs"
              case "$archs" in *arm64*)  ;; *) echo "no arm64 in $name";  exit 1 ;; esac
              case "$archs" in *x86_64*) ;; *) echo "no x86_64 in $name"; exit 1 ;; esac

              # The registration lives in a file-scope constructor nothing names,
              # so a linker that dropped the translation unit still produces a
              # loadable bundle -- one that reports it contains no plugins.
              #
              # Captured and matched with `case`, never `... | grep -q`: under
              # `bash -eo pipefail` a `grep -q` that FINDS its match exits at
              # once, the writer upstream takes SIGPIPE, and the pipeline fails
              # the release on a correct binary.
              symbols=$( nm -gU "$binary" )
              case "$symbols" in *_plugMain*) ;; *) echo "$name exports no plugMain"; exit 1 ;; esac

              # CFBundleExecutable against the binary on disk. A mismatch builds,
              # loads and renders perfectly and then fails codesign with a message
              # that never mentions the plist -- it has cost this fleet a tag.
              exe=$( /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" \
                       "out/$name.bundle/Contents/Info.plist" )
              [ "$exe" = "$name" ] || { echo "CFBundleExecutable is '$exe', not '$name'"; exit 1; }
            done
          else
            for name in "${plugins[@]}"; do
              cp "build/Release/$name.dll" "out/$name.dll"
            done
          fi
          ls -R out

      - name: Archive (zip)
        shell: bash
        run: |
          cd out
          if command -v 7z >/dev/null 2>&1; then
            7z a "../spasis-${{ matrix.name }}.zip" ./*
          else
            zip -r "../spasis-${{ matrix.name }}.zip" ./*
          fi

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A .dmg, but deliberately NOT a .pkg. An FFGL plugin's destination is
        # per-user and edition-specific -- the README installs to
        # ~/Documents/Resolume {Arena,Avenue}/Extra Effects -- so a .pkg would
        # have to guess a path and would silently install to the wrong one for
        # half of users. Mounting an image and dragging the bundles where the
        # README says is the honest shape here.
        run: |
          source scripts/release-lib.sh
          rl_init "Spasis" spasis "${{ steps.ver.outputs.version }}" \
            com.stoatworks.spasis "$GITHUB_WORKSPACE"
          cp README.md out/ 2>/dev/null || true
          for name in "Spasis Field" "Spasis Rose" "Spasis Width" "Spasis Balance"; do
            rl_adhoc_sign "out/$name.bundle"
          done
          rl_dmg "${{ matrix.name }}" out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spasis-${{ matrix.name }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so the installer is wrapped here from the zip the
    # Windows job uploaded. Its directory page defaults to the common FFGL folder
    # but stays editable, because Resolume reads plugins from a path the user
    # chooses per edition.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          rl_init "Spasis" spasis "$version" com.stoatworks.spasis "$PWD/installers"
          zip="$(find artifacts -name "spasis-windows-x86_64.zip" | head -1)"
          if [ -z "$zip" ]; then echo "no Windows artefact, nothing to do"; exit 0; fi
          stage="$RUNNER_TEMP/stage-win"
          rm -rf "$stage"; mkdir -p "$stage"
          unzip -q "$zip" -d "$stage"
          cp README.md "$stage/" 2>/dev/null || true
          # --plain: a plugin needs neither a shortcut nor a PATH entry. It was
          # --cli until nib#2, where the unguarded PATH write wiped a system PATH.
          rl_nsis windows-x86_64 "$stage" --plain
          ls -l installers

      - uses: actions/upload-artifact@v7
        with:
          name: spasis-windows-installer
          path: installers/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
